# =====================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# =====================================================================
spring.application.name=barberia_api
server.port=${PORT:8080}
# Mantiene la API accesible solo desde esta máquina por defecto.
server.address=${SERVER_ADDRESS:127.0.0.1}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# =====================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (MYSQL)
# =====================================================================
# URL de conexión JDBC hacia MySQL con parámetros optimizados:
# - useSSL=false: Desactiva SSL para entornos de desarrollo local.
# - allowPublicKeyRetrieval=true: Permite la recuperación de claves públicas para autenticación segura.
# - serverTimezone=UTC: Estandariza la zona horaria a nivel de base de datos.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/barberia_el_caballero_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:barberia_user}
spring.datasource.password=${DB_PASSWORD:Catgx1402++}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# MIGRACIONES Y VALIDACIÓN DEL ESQUEMA
# =====================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# open-in-view=false: Desactiva el patrón Open Session in View. 
# Es una excelente práctica de rendimiento que asegura que las sesiones de base de datos 
# se cierren correctamente al terminar la capa de servicio, evitando bloqueos y fugas de conexiones.
spring.jpa.open-in-view=false

# Configura la zona horaria explícita de JDBC en Hibernate hacia la hora local oficial de Colombia (`America/Bogota`), 
# garantizando consistencia absoluta en las marcas de tiempo de las citas.
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# =====================================================================
# INICIALIZACIÓN DE DATOS SQL
# =====================================================================
# Flyway administra la estructura y los datos iniciales del esquema.
spring.sql.init.mode=never

# =====================================================================
# GESTIÓN DE ERRORES Y SEGURIDAD DE LA API
# =====================================================================
# Desactiva la inclusión de mensajes técnicos y errores de enlace (*binding errors*) 
# en las respuestas de error predeterminadas del servidor, previniendo la filtración accidental 
# de detalles internos de la arquitectura o trazas de código hacia los clientes externos.
server.error.include-message=never
server.error.include-binding-errors=never